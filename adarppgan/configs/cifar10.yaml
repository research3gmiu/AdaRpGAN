# AdaRpGAN — Default CIFAR-10 Configuration (v2: Single-Digit FID)
# =================================================================
# Use with: python train.py (values here are the argparse defaults)
# Override any field on the command line, e.g.:  python train.py --epochs 800

experiment:
  name:      "adarppgan_cifar10"
  seed:      42
  device:    "auto"          # "auto" → CUDA if available, else CPU/MPS

data:
  dataset:    "cifar10"
  root:       "./data"
  batch_size: 128            # ★ Scaled up from 64 for gradient stability
  workers:    4
  augment:    true           # horizontal flip + random crop

model:
  z_dim:      128
  g_base_ch:  512            # ★ Generator base channels (scaled from 256)
  d_base_ch:  512            # ★ Discriminator base channels (scaled from 128)
  n_classes:  10             # ★ 10 classes for CIFAR-10 projection/CBN

training:
  epochs:        800         # ★ Extended training schedule
  lr_g:          0.0002
  lr_d:          0.0002
  beta1:         0.0
  beta2:         0.999
  eps:           1e-4        # ★ High epsilon for numerical stability
  loss_type:     "hinge"     # ★ Hinge loss (SOTA standard)
  gp_type:       "r1"        # ★ Lazy R1 regularization
  r1_gamma:      10.0
  r1_interval:   16          # ★ Lazy penalty every 16 steps
  warmup_epochs: 5           # ★ Linear warmup
  use_cosine_lr: true        # ★ Cosine annealing
  amp:           true        # Mixed-precision

adaptive_controller:
  # Gamma (GP weight) adaptation
  gamma_init:   10.0
  gamma_min:    1.0
  gamma_max:    50.0
  alpha_gamma:  0.01         # Step size for γ update
  ema_beta:     0.99         # EMA momentum for Lipschitz violation
  viol_target:  0.01         # Desired Lipschitz violation level

  # n_critic adaptation
  n_critic_init: 1
  n_critic_min:  1
  n_critic_max:  5
  window:        50          # Rolling window for variance
  sigma_high:    0.50        # Variance threshold → increase n_critic
  sigma_low:     0.05        # Variance threshold → decrease n_critic
  cooldown:      100         # Steps between n_critic changes

logging:
  ckpt_dir:     "./checkpoints"
  log_every:    100          # Print log every N D-steps
  save_every:   50           # Save checkpoint every N epochs
  sample_every: 25           # Save image grid every N epochs

evaluation:
  n_eval_samples: 50000
  eval_batch:     256

# ── Baseline config (used when --mode baseline) ─────────────────────────────
baseline:
  gamma:    10.0
  n_critic: 1
  ckpt_dir: "./checkpoints_baseline"

