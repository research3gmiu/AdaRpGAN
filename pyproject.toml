[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adarppgan"
version = "1.0.0"
description = "AdaRpGAN: A Self-Tuning GAN Training Framework with Adaptive Gradient Penalty and Dynamic Critic Scheduling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AdaRpGAN Authors"},
]
keywords = ["GAN", "generative-adversarial-network", "deep-learning", "pytorch", "adaptive-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.15.0"]
pdf = ["fpdf2>=2.7.0"]
all = ["wandb>=0.15.0", "tensorboard>=2.13.0", "fpdf2>=2.7.0"]

[project.urls]
Homepage = "https://github.com/yourusername/adarppgan"
Documentation = "https://github.com/yourusername/adarppgan#readme"
Repository = "https://github.com/yourusername/adarppgan"
Issues = "https://github.com/yourusername/adarppgan/issues"

[project.scripts]
adarppgan = "adarppgan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adarppgan*"]
