name: CI — Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import check
        run: python -c "import adarppgan; print(f'adarppgan v{adarppgan.__version__} imported OK')"

      - name: CLI help — train
        run: adarppgan train --help

      - name: CLI help — evaluate
        run: adarppgan evaluate --help

      - name: CLI help — run-all
        run: adarppgan run-all --help

      - name: CLI version
        run: adarppgan version

      - name: Quick training smoke test (1 epoch, CPU)
        run: |
          cd adarppgan
          python train.py --epochs 1 --batch 8 --no-amp --save-every 999 --log-every 1
        timeout-minutes: 10
